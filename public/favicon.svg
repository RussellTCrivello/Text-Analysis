<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Text Analysis Manager">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- Document with folded corner -->
  <path d="M152 108h140l68 68v228a20 20 0 0 1-20 20H152a20 20 0 0 1-20-20V128a20 20 0 0 1 20-20z"
        fill="#FFFFFF"/>
  <path d="M292 108l68 68h-56a12 12 0 0 1-12-12z" fill="#C7D2FE"/>

  <!-- Text lines -->
  <g fill="#4F46E5">
    <rect x="172" y="202" width="148" height="18" rx="9"/>
    <rect x="172" y="244" width="148" height="18" rx="9"/>
    <rect x="172" y="286" width="86"  height="18" rx="9"/>
  </g>

  <!-- Analysis bars: the text resolving into measurement -->
  <g fill="#4338CA">
    <rect x="172" y="358" width="36" height="44" rx="8"/>
    <rect x="228" y="334" width="36" height="68" rx="8"/>
    <rect x="284" y="310" width="36" height="92" rx="8"/>
  </g>
</svg>
