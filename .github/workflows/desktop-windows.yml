name: Desktop (Windows installer)

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'electron/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, verify and (on tag) release
    runs-on: windows-latest
    permissions:
      contents: write # needed only for the release step, gated by the tag condition below
      pull-requests: write # verification summary comment on PRs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve product identity from package.json
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          # Display/install name follows productName; the on-disk userData folder
          # is pinned in electron/main.cjs so rebranding never orphans records.
          "PRODUCT_NAME=$($pkg.productName)"  | Out-File -Append $env:GITHUB_ENV
          "APP_VERSION=$($pkg.version)"       | Out-File -Append $env:GITHUB_ENV
          "USER_DATA_NAME=Text Analysis"      | Out-File -Append $env:GITHUB_ENV
          Write-Host "productName=$($pkg.productName) version=$($pkg.version)"

      - run: npm run typecheck
      - run: npm run test
      - run: npm run smoke
      - run: npm run smoke:dom

      - name: Build installer
        run: npm run dist:win
        env:
          # Code signing: set CSC_LINK (base64 .pfx) and CSC_KEY_PASSWORD as
          # repository secrets to sign; leave unset to build unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: List release output
        shell: pwsh
        run: |
          Get-ChildItem release | Format-Table Name, Length
          $setup = Get-ChildItem 'release\*Setup*.exe' | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $setup.FullName
          "## Desktop (Windows) verification`n" | Out-File -Append "$env:RUNNER_TEMP\verification.md"
          "* Installer: ``$($setup.Name)`` ($([math]::Round($setup.Length/1MB,1)) MB), Authenticode: **$($sig.Status)**" | Out-File -Append "$env:RUNNER_TEMP\verification.md"
          "* Electron $(node -p "require('electron/package.json').version"), electron-builder $(node -p "require('electron-builder/package.json').version"), Node $(node -v)" | Out-File -Append "$env:RUNNER_TEMP\verification.md"

      # ---- Verify the *unpacked* app: renders over app://, sandbox, storage ----
      - name: Smoke-test packaged app (launch 1 - fresh profile)
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'release\win-unpacked\*.exe' | Select-Object -First 1
          $out = "$env:RUNNER_TEMP\smoke1.json"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test',"--smoke-out=$out" -PassThru -Wait
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "smoke run 1 failed with exit code $($p.ExitCode)" }

      - name: Smoke-test packaged app (launch 2 - data must persist across restart)
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'release\win-unpacked\*.exe' | Select-Object -First 1
          $out = "$env:RUNNER_TEMP\smoke2.json"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test',"--smoke-out=$out" -PassThru -Wait
          $r = Get-Content $out | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 5
          "* Unpacked app: origin ``$($r.checks.origin)``, secureContext=$($r.checks.isSecureContext), rootChildren=$($r.checks.rootChildren), stylesheets=$($r.checks.stylesheets), nodeGlobals=$($r.checks.hasRequire -or $r.checks.hasProcess -or $r.checks.hasNodeBuffer), preload=``$($r.checks.desktopKeys -join ',')``" | Out-File -Append "$env:RUNNER_TEMP\verification.md"
          "* Persistence across restart: localStorage=$([bool]$r.checks.lsPrevious), IndexedDB=$([bool]$r.checks.idb.previous); userData ``$($r.userData)``" | Out-File -Append "$env:RUNNER_TEMP\verification.md"
          if ($p.ExitCode -ne 0) { throw "smoke run 2 failed" }
          if (-not $r.checks.lsPrevious) { throw "localStorage did not persist across restart" }
          if (-not $r.checks.idb.previous) { throw "IndexedDB did not persist across restart" }
          if (-not $r.userData.StartsWith($env:APPDATA)) { throw "userData is not under %APPDATA%: $($r.userData)" }
          # userData must stay pinned to the historical folder even though the
          # productName is now "Text Analysis Manager" — renaming the product
          # must never strand an existing user's records.
          $expected = Join-Path $env:APPDATA $env:USER_DATA_NAME
          if ($r.userData -ne $expected) { throw "userData drifted: expected $expected, got $($r.userData)" }
          Write-Host "userData: $($r.userData)"

      # ---- Verify the NSIS installer end to end ----
      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'release\*Setup*.exe' | Select-Object -First 1
          Write-Host "Installer: $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }

      - name: Verify install location, shortcuts, registry, launch
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\$env:PRODUCT_NAME"
          if (-not (Test-Path "$installDir\$env:PRODUCT_NAME.exe")) { throw "app exe missing in $installDir" }
          Write-Host "Installed to: $installDir (per-user)"
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) "$env:PRODUCT_NAME.lnk"
          $startMenu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\$env:PRODUCT_NAME.lnk"
          if (-not (Test-Path $desktop)) { throw "desktop shortcut missing: $desktop" }
          if (-not (Test-Path $startMenu)) { throw "start menu shortcut missing: $startMenu" }
          $sh = New-Object -ComObject WScript.Shell
          Write-Host "Desktop shortcut ->" $sh.CreateShortcut($desktop).TargetPath
          Write-Host "Start Menu shortcut ->" $sh.CreateShortcut($startMenu).TargetPath
          $reg = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
                 Get-ItemProperty | Where-Object { $_.DisplayName -eq $env:PRODUCT_NAME }
          if (-not $reg) { throw 'Add/Remove Programs entry missing (HKCU)' }
          Write-Host "Uninstall entry: $($reg.DisplayName) $($reg.DisplayVersion) -> $($reg.UninstallString)"
          $pkg = Get-Content package.json | ConvertFrom-Json
          if ($reg.DisplayVersion -ne $pkg.version) { throw "version mismatch: registry $($reg.DisplayVersion) vs package.json $($pkg.version)" }
          # Launch the *installed* app once more; it shares the same userData so
          # the markers written by the unpacked runs must still be visible.
          $out = "$env:RUNNER_TEMP\smoke3.json"
          $p = Start-Process -FilePath "$installDir\$env:PRODUCT_NAME.exe" -ArgumentList '--smoke-test',"--smoke-out=$out" -PassThru -Wait
          $r = Get-Content $out | ConvertFrom-Json
          if ($p.ExitCode -ne 0) { throw 'installed app smoke failed' }
          if (-not $r.isPackaged) { throw 'installed app does not report isPackaged' }
          if (-not $r.checks.lsPrevious) { throw 'installed app lost localStorage' }
          Write-Host "Installed app OK; userData=$($r.userData)"
          "* Installed to ``$installDir`` (per-user); shortcuts: Desktop ✔ Start Menu ✔; uninstall entry ``$($reg.DisplayName) $($reg.DisplayVersion)`` (HKCU); installed app isPackaged=$($r.isPackaged), data visible=$([bool]$r.checks.lsPrevious)" | Out-File -Append "$env:RUNNER_TEMP\verification.md"

      - name: Single-instance check
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Programs\$env:PRODUCT_NAME\$env:PRODUCT_NAME.exe"
          $first = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          $second = Start-Process -FilePath $exe -PassThru
          $second.WaitForExit(15000) | Out-Null
          if (-not $second.HasExited) { Stop-Process -Id $second.Id -Force; throw 'second instance did not exit (single-instance lock failed)' }
          if ($first.HasExited) { throw 'first instance died unexpectedly' }
          Write-Host 'Second instance exited immediately; first instance still running.'
          "* Single instance: second process exited in $([int]($second.ExitTime - $second.StartTime).TotalMilliseconds) ms, first still alive ✔" | Out-File -Append "$env:RUNNER_TEMP\verification.md"
          Stop-Process -Id $first.Id -Force

      - name: Uninstall silently and verify user data survives
        shell: pwsh
        run: |
          $userData = Join-Path $env:APPDATA $env:USER_DATA_NAME
          if (-not (Test-Path $userData)) { throw "expected userData dir $userData to exist before uninstall" }
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\$env:PRODUCT_NAME"
          $p = Start-Process -FilePath "$installDir\Uninstall $env:PRODUCT_NAME.exe" -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "uninstaller exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 5 # NSIS uninstaller copies itself to temp and finishes async
          if (Test-Path "$installDir\$env:PRODUCT_NAME.exe") { throw 'app exe still present after uninstall' }
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) "$env:PRODUCT_NAME.lnk"
          if (Test-Path $desktop) { throw 'desktop shortcut still present after uninstall' }
          if (-not (Test-Path $userData)) { throw 'uninstall deleted user data (should be preserved)' }
          Write-Host "Uninstalled cleanly; user data preserved at $userData"
          "* Silent uninstall: binaries + shortcuts removed ✔, user data preserved at ``$userData`` ✔" | Out-File -Append "$env:RUNNER_TEMP\verification.md"

      - name: Publish verification summary
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP\verification.md" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Post verification summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + "/verification.md", 'utf8') +
              `\n_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} (windows-latest)_`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - uses: actions/upload-artifact@v4
        with:
          name: TextAnalysis-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Attach to GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
